name: Generate Final Highlights AI

on:
  workflow_dispatch:
    inputs:
      generation_mode:
        description: "auto = incremental until 104, then full final; full = force full rebuild; incremental = append missing final-stage matches"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "incremental", "full"]
      allow_preview_generation:
        description: "Allow generation before all 104 matches are completed?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_visible:
        description: "Insert posts as visible=true? Use true if you want participants to see them."
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      max_highlights:
        description: "Maximum highlight posts to ask for"
        required: true
        default: "40"
      reset_existing:
        description: "Delete old final_highlights/final_profile rows before inserting new rows?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]


env:
  AUTOMATION_ACTIVE_UNTIL: "2026-07-20T23:00:00Z"

concurrency:
  group: generate-final-highlights
  cancel-in-progress: false

jobs:
  generate-final-highlights:
    runs-on: ubuntu-latest

    steps:
      - name: Check automatic-call window
        id: automation_window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: automatic cutoff does not apply."
            exit 0
          fi

          now_epoch=$(date -u +%s)
          cutoff_epoch=$(date -u -d "$AUTOMATION_ACTIVE_UNTIL" +%s)

          if (( now_epoch <= cutoff_epoch )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled external calls allowed until $AUTOMATION_ACTIVE_UNTIL."
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled external calls stopped after $AUTOMATION_ACTIVE_UNTIL. Manual workflow_dispatch runs remain available."
          fi
      - name: Checkout repository
        if: steps.automation_window.outputs.allowed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.automation_window.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate final highlights and profile messages
        if: steps.automation_window.outputs.allowed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_PROVIDER: "openrouter"
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # For AI_PROVIDER=openrouter, the script uses OPENROUTER_* and ignores stale AI_BASE_URL/AI_MODEL.
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: "qwen/qwen3.6-plus"
          OPENROUTER_FALLBACK_MODELS: ""
          OPENROUTER_USE_FALLBACK_MODELS: "false"
          OPENROUTER_HTTP_REFERER: ${{ secrets.OPENROUTER_HTTP_REFERER }}
          OPENROUTER_APP_TITLE: "World Cup 2026 Predictions"
          AI_RESPONSE_FORMAT: ${{ secrets.AI_RESPONSE_FORMAT || 'false' }}
          AI_DISABLE_REPAIR_CALL: "false"
          AI_TEMPERATURE: "0.55"
          AI_MAX_TOKENS: "7000"
          AI_BATCH_GENERATION: "true"
          AI_BATCH_HIGHLIGHT_TARGET: "6"
          AI_EVENT_NOTE_BATCH_SIZE: "30"
          AI_FACT_BATCH_SIZE: "40"
          AI_USE_EVENT_ONLY_BATCHES: "false"
          AI_ENABLE_FILL_MATCHES: "false"
          AI_REQUIRE_CONTEST_SIGNAL: "true"
          AI_STORY_SEED_BATCH_SIZE: "6"
          AI_POST_BODY_MAX_CHARS: "460"
          AI_HIGHLIGHT_MAX_WORDS: "54"
          AI_ENFORCE_UNIQUE_TITLES: "true"
          AI_TITLE_MATCH_HINT: "true"
          AI_MAX_BATCHES_PER_RUN: "14"
          AI_INSERT_PARTIAL_ON_QUOTA: "true"
          AI_INSERT_PARTIAL_ON_BATCH_FAILURE: "true"
          AI_INSERT_PARTIAL_ON_MAX_BATCHES: "true"
          AI_MIN_HIGHLIGHTS_FOR_PARTIAL_INSERT: "12"
          AI_MIN_VALID_HIGHLIGHT_ROWS: "24"
          AI_TOP_UP_WITH_CALCULATED_HIGHLIGHTS: "true"
          AI_CALCULATED_HIGHLIGHT_TOP_UP_TO: "28"
          AI_CONTINUE_ON_BATCH_FAILURE: "true"
          AI_MAX_FAILED_BATCHES: "10"
          AI_ENABLE_CONTEST_MOMENT_BATCHES: "false"
          AI_INSERT_PARTIAL_ANY_STORY_COUNT: "false"
          EXPECTED_WORLD_CUP_MATCH_COUNT: "104"
          ALLOW_FINAL_PREVIEW: ${{ inputs.allow_preview_generation }}
          PUBLISH_VISIBLE: ${{ inputs.publish_visible }}
          MAX_HIGHLIGHTS: ${{ inputs.max_highlights }}
          AI_PUBLIC_HIGHLIGHT_TARGET: "32"
          AI_GROUP_STAGE_HIGHLIGHT_MAX: "10"
          AI_PARTICIPANT_HIGHLIGHT_MAX: "6"
          AI_STAGE_SUMMARY_MAX: "2"
          AI_STYLE_FAMILY_MAX: "3"
          AI_MAX_CALCULATED_TOP_UP: "4"
          RESET_EXISTING_FINAL_AI: ${{ inputs.reset_existing }}
          GENERATE_PROFILES: "auto"
          AI_GENERATION_MODE: ${{ inputs.generation_mode }}
          INCREMENTAL_BASE_COMPLETED_MATCH_COUNT: "98"
          AI_AUTO_STAGE_MODE: "false"
          AI_AUTO_MIN_MATCH_AGE_HOURS: "2.5"
          AUTO_GENERATION_REMAINING_MATCHES: "6"
          AI_SKIP_IF_SAME_COMPLETED_COUNT_EXISTS: "false"
          MIN_APPROVED_EVENT_NOTES: "0"
          REQUIRE_EVENT_NOTES_FOR_PUBLISH: "false"
          USE_TRUSTED_EVENT_NOTES: "true"
          MAX_EVENT_NOTES_FOR_AI: "120"
          TRUSTED_EVENT_SOURCE_PATTERNS: "Football-Data.org,API-Football,GDELT"
        run: node scripts/generate-ai-posts.mjs
